<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shortly — URL Shortener</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Manrope:wght@800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>

<body>
  <nav class="nav-bar" aria-label="Main navigation">
    <a class="brand" href="/" aria-label="Shortly home">
      <span class="brand-mark" aria-hidden="true"></span>
      <span>shortly</span>
    </a>
    <div class="nav-actions">
      <span class="status-badge" id="statusBadge">PostgreSQL mode</span>
      <a class="nav-link" href="#recent">Recent links</a>
    </div>
  </nav>

  <main>
    <section class="hero-band">
      <div class="hero-inner">
        <div class="hero-copy">
          <p class="eyebrow">Simple link management</p>
          <h1>Make long links <span>short.</span></h1>
          <p class="hero-lead">Create clean, shareable links in seconds. Fast, simple, and ready for wherever you send them.</p>
        </div>

        <section class="converter-card" aria-labelledby="shortenHeading">
          <div class="converter-heading">
            <div>
              <p class="form-kicker">Create a link</p>
              <h2 id="shortenHeading">Paste your URL</h2>
            </div>
            <div class="link-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l2-2a5 5 0 0 0-7.07-7.07l-1.15 1.15M14 11a5 5 0 0 0-7.54-.54l-2 2a5 5 0 0 0 7.07 7.07l1.15-1.15" /></svg>
            </div>
          </div>

          <form id="urlForm">
            <label for="urlInput">Long URL</label>
            <input id="urlInput" type="url" placeholder="https://example.com/a-long-link" required />
            <button class="primary-button" type="submit">Shorten link</button>
          </form>

          <div id="message" class="message" aria-live="polite"></div>

          <div class="short-url-card hidden" id="shortUrlCard">
            <div class="short-url-copy">
              <span>Your short link</span>
              <a id="shortUrl" href="#" target="_blank" rel="noreferrer"></a>
            </div>
            <button class="icon-button" id="copyBtn" type="button" aria-label="Copy short link" title="Copy">
              <svg viewBox="0 0 24 24"><rect x="8" y="8" width="11" height="11" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>
            </button>
          </div>
        </section>
      </div>
    </section>

    <section class="content-band" id="recent">
      <div class="content-inner">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Your workspace</p>
            <h2>Recent links</h2>
          </div>
          <button id="refreshBtn" class="secondary-button" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8.1 8.1 0 1 0-2.3 6.7M20 4v7h-7"/></svg>
            Refresh
          </button>
        </div>
        <form id="trackUrlForm" class="track-url-form">
          <div>
            <label for="trackUrlInput">Track an existing short link</label>
            <input id="trackUrlInput" type="url" placeholder="Paste a short link from this site" required />
          </div>
          <button class="secondary-button" type="submit">Add link</button>
        </form>
        <div id="urlList" class="url-list"></div>
      </div>
    </section>
  </main>

  <footer>
    <div class="footer-inner">
      <a class="brand brand-footer" href="/" aria-label="Shortly home">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>shortly</span>
      </a>
      <p>Short links. Simple sharing.</p>
    </div>
  </footer>

  <script type="module" src="/app.js"></script>
</body>

</html>
