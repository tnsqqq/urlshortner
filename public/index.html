<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shortly URL Shortener</title>
  <link rel="stylesheet" href="/styles.css" />
</head>

<body>
  <main class="container">
    <section class="panel hero">
      <div>
        <p class="eyebrow">URL shortener</p>
        <h1>Turn long links into short ones.</h1>
      </div>
      <div class="status" id="statusBadge">Memory mode</div>
    </section>

    <section class="panel form-panel">
      <form id="urlForm">
        <label for="urlInput">Paste a long URL</label>
        <div class="input-row">
          <input id="urlInput" type="url" placeholder="https://example.com/some/long/path" required />
          <button type="submit">Shorten</button>
        </div>
      </form>

      <div id="message" class="message" aria-live="polite"></div>

      <div class="short-url-card hidden" id="shortUrlCard">
        <span>Your short link</span>
        <a id="shortUrl" href="#" target="_blank" rel="noreferrer"></a>
      </div>
    </section>

    <section class="panel analytics-panel">
      <div class="section-title-row">
        <h2>Recent links</h2>
        <button id="refreshBtn" class="secondary" type="button">Refresh</button>
      </div>
      <div id="urlList" class="url-list"></div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>

</html>
